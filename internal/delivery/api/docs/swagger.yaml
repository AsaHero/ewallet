basePath: /api
definitions:
  apierr.Response:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  models.Account:
    properties:
      balance:
        type: number
      created_at:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.AuthRequest:
    properties:
      currency_code:
        type: string
      first_name:
        type: string
      language_code:
        type: string
      last_name:
        type: string
      tg_user_id:
        type: integer
      username:
        type: string
    required:
    - tg_user_id
    type: object
  models.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.Category:
    properties:
