    type: object
  models.PayDebtRequest:
    properties:
      paid_at:
        type: string
    type: object
  models.Subcategory:
    properties:
      category_id:
        type: integer
      created_at:
        type: string
      emoji:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.Transaction:
    properties:
      account_id:
        type: string
      amount:
        type: number
      category_id:
        type: integer
      created_at:
        type: string
      currency_code:
        type: string
      fx_rate:
        type: number
      id:
        type: string
      note:
        type: string
      original_amount:
        type: number
      original_currency_code:
        type: string
      performed_at:
        type: string
      rejected_at:
        type: string
      status:
        type: string
      subcategory_id:
        type: integer
      type:
        type: string
      user_id:
        type: string
    type: object
  models.TransactionsResponse:
    properties:
      items:
