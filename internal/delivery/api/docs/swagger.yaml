  query.AccountStatsView:
    properties:
      from:
        type: string
      items:
        items:
          $ref: '#/definitions/query.AccountStatsItem'
        type: array
      to:
        type: string
      totals:
        $ref: '#/definitions/query.AccountStatsTotals'
