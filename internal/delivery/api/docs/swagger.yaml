      category_id:
        type: integer
      currency_code:
        type: string
      fx_rate:
        type: number
      note:
        type: string
      original_amount:
        type: number
      original_currency_code:
        type: string
      performed_at:
        type: string
      subcategory_id:
        type: integer
      type:
        type: string
    required:
