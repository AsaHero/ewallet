info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Autocollection Backend API Documentation
  title: Autocollection Backend Docs
  version: 0.0.1
paths:
  /accounts:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Account'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Lists accounts for the authenticated user
      tags:
      - Accounts
    post:
      consumes:
      - application/json
      parameters:
      - description: request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Account'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Creates a new account
      tags:
      - Accounts
  /accounts/{id}:
    delete:
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Deletes an account
      tags:
      - Accounts
    patch:
      consumes:
      - application/json
      parameters:
      - description: account id
        in: path
        name: id
        required: true
        type: string
      - description: request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Account'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Updates account information
      tags:
      - Accounts
  /auth/telegram:
    post:
      consumes:
      - application/json
      description: Creates a new user session using Telegram payload and returns JWT
        token
      parameters:
      - description: request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierr.Response'
      summary: Authenticates user through telegram
      tags:
      - Auth
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/query.Category'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Lists available categories
      tags:
      - Categories
    post:
      parameters:
      - description: request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Category'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Create a new category
      tags:
      - Categories
  /categories/{id}:
    delete:
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Delete a category
      tags:
      - Categories
  /debts:
    get:
      parameters:
      - description: limit
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      - collectionFormat: csv
        description: transaction ids
        in: query
        items:
          type: string
        name: transaction_ids
        type: array
      - collectionFormat: csv
        description: debt types (borrow, lend)
        in: query
        items:
          type: string
        name: types
        type: array
      - collectionFormat: csv
        description: debt statuses (open, paid, cancelled)
        in: query
        items:
          type: string
        name: statuses
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DebtsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Lists debts with pagination
      tags:
      - Debts
    post:
      consumes:
      - application/json
      parameters:
      - description: request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateDebtRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Debt'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Creates a debt
      tags:
      - Debts
  /debts/{id}:
    get:
      parameters:
      - description: debt id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Debt'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Returns debt by ID
      tags:
      - Debts
    put:
      consumes:
      - application/json
      parameters:
      - description: debt id
        in: path
        name: id
        required: true
        type: string
      - description: request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateDebtRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Debt'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Updates a debt
      tags:
      - Debts
  /debts/{id}/cancel:
    post:
      parameters:
      - description: debt id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Debt'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
      security:
      - BearerAuth: []
      summary: Cancels a debt
      tags:
      - Debts
  /debts/{id}/pay:
    post:
      consumes:
      - application/json
      parameters:
      - description: debt id
        in: path
        name: id
        required: true
        type: string
      - description: request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PayDebtRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Debt'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierr.Response'
