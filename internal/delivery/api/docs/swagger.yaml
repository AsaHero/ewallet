      amount:
        type: number
      created_at:
        type: string
      currency_code:
        type: string
      due_at:
        type: string
      id:
        type: string
      name:
        type: string
      note:
        type: string
      paid_at:
        type: string
      status:
        description: open, paid, cancelled
        type: string
      transaction_id:
        type: string
      type:
        description: borrow, lend
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  models.DebtsResponse:
    properties:
      items:
