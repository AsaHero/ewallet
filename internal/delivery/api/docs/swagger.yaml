      amount:
        type: number
      category_id:
        type: integer
      confidence:
        type: number
      currency:
        type: string
      debt_details:
        $ref: '#/definitions/parser.DebtDetailsResult'
      fx_rate:
        type: number
      note:
        type: string
      original_amount:
        type: number
      original_currency:
        type: string
      performed_at:
        type: string
      subcategory_id:
        type: integer
      type:
        type: string
    type: object
  parser.ParseTextDebtView:
    properties:
      amount:
        type: number
      confidence:
        type: number
      counterparty_name:
        type: string
      currency:
        type: string
      due_date:
        type: string
      note:
        type: string
      type:
        type: string
    type: object
  parser.ParseTextView:
    properties:
      account_id:
        type: string
      amount:
        type: number
      category_id:
        type: integer
      confidence:
        type: number
      currency:
        type: string
      debt_details:
        $ref: '#/definitions/parser.DebtDetailsResult'
      fx_rate:
        type: number
      note:
        type: string
      original_amount:
        type: number
      original_currency:
        type: string
      performed_at:
        type: string
      subcategory_id:
        type: integer
      type:
        type: string
    type: object
  query.AccountBalanceSeriesView:
    properties:
      account_id:
        type: string
      points:
        items:
          $ref: '#/definitions/query.BalanceTimeseriesPointView'
        type: array
      totals:
        $ref: '#/definitions/query.BalanceTimeseriesTotalsView'
    type: object
  query.AccountStatsItem:
    properties:
      account_id:
        type: string
      count:
        type: integer
      expense:
        type: number
      income:
        type: number
      name:
        type: string
      net:
        type: number
    type: object
  query.AccountStatsTotals:
    properties:
      count:
        type: integer
      expense:
        type: number
      income:
        type: number
      net:
        type: number
