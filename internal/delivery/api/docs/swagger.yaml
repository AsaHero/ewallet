      amount:
        type: number
      category_id:
        type: integer
      confidence:
        type: number
      currency:
        type: string
      debt_details:
        $ref: '#/definitions/parser.DebtDetailsResult'
      fx_rate:
        type: number
      note:
        type: string
      original_amount:
        type: number
      original_currency:
        type: string
      performed_at:
        type: string
      subcategory_id:
        type: integer
      type:
        type: string
    type: object
  parser.ParseImageView:
    properties:
